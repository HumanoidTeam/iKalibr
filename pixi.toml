[project]
name = "ikalibr"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-noetic"
]
platforms = ["linux-64"]

[dependencies]
python = "*"

# Toolchain
compilers = "*"
cmake = ">=3.27"
make = "*"
ninja = "*"
pkg-config = "*"
git = "*"
gcc = ">=14.3.0,<14.4"
gxx = ">=14.3.0,<14.4"

# Core C++ deps
eigen = "3.4.*"
ceres-solver = "2.2.*"
suitesparse = "*"
glog = "*"
gflags = "*"
spdlog = "*"
cereal = "*"
yaml-cpp = ">=0.8,<0.9"
magic_enum = ">=0.9.6,<0.10"
sophus = "*"
opencv = ">=4.5"

# Graphics / viewers
pangolin-opengl = ">=0.9,<1"
libgl-devel = "*"

# SfM tools
colmap = ">=3.12"
glomap = ">=1.1"

# Required by thirdparty: tiny-viewer and ufomap
pcl = "*"
tbb = "*"

# ROS deps
catkin_tools = "*"
ros-noetic-desktop = "*"
ros-noetic-catkin = "*"
ros-noetic-cv-bridge = "*"
ros-noetic-velodyne = "*"
ros-noetic-pcl-ros = "*"

[tasks]
# Remove all thirdparty build + install dirs
clean-thirdparty = """
bash -lc '
  rm -rf \
    ./iKalibr/thirdparty/ctraj/thirdparty/tiny-viewer-build \
    ./iKalibr/thirdparty/ctraj/thirdparty/tiny-viewer-install \
    ./iKalibr/thirdparty/ctraj-build ./iKalibr/thirdparty/ctraj-install \
    ./iKalibr/thirdparty/ufomap-build ./iKalibr/thirdparty/ufomap-install \
    ./iKalibr/thirdparty/veta-build ./iKalibr/thirdparty/veta-install \
    ./iKalibr/thirdparty/opengv-build ./iKalibr/thirdparty/opengv-install || true
  echo "thirdparty builds cleaned."
'
"""

# Build thirdparty deps (uses the cleaned environment if run after above)
thirdparty = "bash -lc 'cd ./iKalibr && ./build_thirdparty.sh'"

msgs = """
bash -lc '
  catkin_make -j$(nproc) \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$PIXI_PROJECT_ROOT/src/iKalibr/patches/opengl_compat.cmake \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
    ikalibr_generate_messages
'
"""

build = """
bash -lc '
  catkin_make -j$(nproc) \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$PIXI_PROJECT_ROOT/src/iKalibr/patches/combined_compat.cmake \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
    -Dmagic_enum_DIR=$CONDA_PREFIX/share/cmake/magic_enum \
    -DCMAKE_CXX_FLAGS="-I$CONDA_PREFIX/include" \
    -DUSE_CMAKE_UNITY_BUILD=ON
'
"""
launch = """
bash -c '
  source devel/setup.bash && \
  roslaunch $PIXI_PROJECT_ROOT/src/iKalibr/launch/solver/ikalibr-prog.launch \
    config_path:=$PIXI_PROJECT_ROOT/src/iKalibr/config/ikalibr-dataset-config.yaml
'
"""
roscore = "roscore"


